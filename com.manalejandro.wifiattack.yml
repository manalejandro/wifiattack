Name: WiFi Attack Detector
Summary: Detect and track WiFi attacks in real-time
Description: |
  WiFi Attack Detector monitors WiFi network activity to detect potential
  security threats. It analyzes WiFi scan results to identify suspicious
  patterns that may indicate deauthentication attacks, evil twin attacks,
  beacon floods, and probe floods.

  Features:
  * Real-time WiFi monitoring with continuous network scanning
  * Deauthentication, evil twin, beacon flood, and probe flood detection
  * Channel statistics with threat level indicators (None to Critical)
  * Support for 2.4GHz, 5GHz, and 6GHz bands
  * Signal direction tracking using compass and accelerometer
  * Material Design 3 with Jetpack Compose
  * Dark and light theme support
  * No internet connection required
  * No data collection or tracking

  This app uses publicly available Android APIs and provides estimates
  based on observable network behavior.

